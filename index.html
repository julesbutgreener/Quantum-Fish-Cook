<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D asset viewer</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6e1; --muted:#8a8f98; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #hint { position:fixed; left:16px; bottom:16px; font-size:14px; color:var(--muted); pointer-events:none; }
  #drop { position:fixed; inset:0; display:none; place-items:center; background:rgba(20,22,26,.8); font-size:20px; }
  #drop.on { display:grid; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Drag in a .glb file to preview it. Drag to orbit, scroll to zoom.</div>
<div id="drop">Drop .glb to load</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
